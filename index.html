<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bolão App</title>
  <meta name="description" content="Participe dos melhores bolões de futebol!" />
  <meta name="theme-color" content="#0A0A0B" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A0A0B;
      color: #FAFAFA;
      margin: 0;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0A0A0B;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="ios-debug"
    style="position:fixed;top:0;left:0;width:100%;max-height:50%;overflow:auto;background:rgba(255,0,0,0.95);color:white;z-index:999999;font-size:10px;padding:20px;display:none;font-family:monospace;pointer-events:all;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
    <b style="font-size:14px;">🚨 ERRO PÓS-LOGIN (DEBUG)</b><br>
    <div id="ios-msg" style="background:rgba(0,0,0,0.3);padding:10px;border-radius:5px;white-space:pre-wrap;"></div>
  </div>

  <script>
    (function () {
      // --- FORENSIC BLACKBOX (LEGACY SYNTAX FOR OLD iOS) ---
      window.Forensic = {
        save: function (msg) {
          try {
            var log = JSON.parse(localStorage.getItem('ios_forensic_log') || '[]');
            log.push({ t: new Date().toLocaleTimeString(), m: msg });
            if (log.length > 50) log.shift();
            localStorage.setItem('ios_forensic_log', JSON.stringify(log));
            console.log("🧬 [Forensic]: " + msg);
          } catch (e) { }
        },
        show: function () {
          var log = JSON.parse(localStorage.getItem('ios_forensic_log') || '[]');
          var panel = document.getElementById('forensic-panel');
          var content = document.getElementById('forensic-content');
          if (panel && content) {
            content.innerText = log.map(function (i) { return "[" + i.t + "] " + i.m; }).join('\n');
            panel.style.display = 'block';
          }
        },
        clear: function () {
          localStorage.removeItem('ios_forensic_log');
          location.reload();
        }
      };

      var ua = navigator.userAgent;
      var isLegacyIOS = /iPhone|iPad|iPod/.test(ua) && /OS [1-9]_|OS 1[0-3]_/.test(ua);

      // Safe body access
      function setLegacyClass() {
        if (isLegacyIOS && document.body) {
          document.body.className += " ios-legacy";
          window.Forensic.save("DEVICE: Aplicado Estilo Legacy (iOS)");
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setLegacyClass);
      } else {
        setLegacyClass();
      }

      window.Forensic.save("BOOT: v1.8 Adaptive Lifecycle");

      // 1. FLASH/LOOP KILLER (More tolerant)
      var now = Date.now();
      var lastReload = parseInt(localStorage.getItem('ios_last_reload') || '0');
      var reloadCount = parseInt(localStorage.getItem('ios_reload_count') || '0');

      if (now - lastReload < 2000) {
        reloadCount++;
        window.Forensic.save("LOOP CHECK: Rápido (" + reloadCount + ")");
      } else {
        // If it took > 2s since last boot, maybe we are okay, but don't reset yet
        // reloadCount = 0; 
      }
      localStorage.setItem('ios_last_reload', now);
      localStorage.setItem('ios_reload_count', reloadCount);

      if (reloadCount > 25) { // Increased to 25 to avoid false blocks
        window.Forensic.save("FATAL: Bloqueando Loop após 25 tentativas.");
        document.body.innerHTML = '<div style="background:red; color:white; padding:40px; text-align:center; height:100vh; font-family:sans-serif;"><h1>⚠️ ESTABILIZANDO...</h1><p>Muitas tentativas de abertura. Por favor, limpe o cache.</p><button onclick="localStorage.clear();location.reload();" style="padding:15px; background:white; color:red; border:none; border-radius:10px; font-weight:bold;">LIMPAR TUDO</button></div>';
        window.stop();
        return;
      }

      // 2. SMART SW VACINE
      if ('serviceWorker' in navigator) {
        if (isLegacyIOS || reloadCount > 5) {
          window.Forensic.save("PWA: Modo de Segurança (SW Off).");
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });

          navigator.serviceWorker.register = function () {
            return new Promise(function (res, rej) { rej(new Error("Disabled for stability")); });
          };
        }
      }

      // 3. UNIVERSAL ERROR CATCHER
      function showErr(m, stack) {
        window.Forensic.save("RUNTIME ERROR: " + m);
        var debug = document.getElementById('ios-debug');
        var msg = document.getElementById('ios-msg');
        if (debug && msg) {
          debug.style.display = 'block';
          msg.innerHTML += "<b>[" + new Date().toLocaleTimeString() + "]</b> " + m + "\n" + (stack || "") + "\n\n";
        }
      }
      window.onerror = function (m, u, l, c, e) {
        showErr(m, (e && e.stack) ? e.stack : "Arquivo: " + u + " Linha:" + l);
        return false;
      };
      window.onunhandledrejection = function (e) {
        showErr("Promessa Rejeitada: " + e.reason);
      };

      // 4. DEBUG GESTURE
      var taps = 0;
      var lastTap = 0;
      window.addEventListener('touchstart', function () {
        var now_t = Date.now();
        if (now_t - lastTap < 400) taps++; else taps = 1;
        lastTap = now_t;
        if (taps >= 6) window.Forensic.show();
      });
    })();
  </script>

  <!-- BOTAO DE DEBUG PERMANENTE -->
  <button onclick="window.Forensic.show()"
    style="position:fixed; bottom:80px; left:10px; z-index:9999999; background:blue; color:white; border:none; border-radius:10px; padding:10px; font-size:12px; font-weight:bold; box-shadow:0 0 10px rgba(0,0,0,0.5);">DEBUG
    🧬</button>

  <div id="forensic-panel"
    style="display:none; position:fixed; top:20px; left:20px; right:20px; bottom:20px; background:rgba(0,0,0,0.95); color:#0f0; z-index:9999999; padding:20px; font-family:monospace; font-size:10px; border:2px solid #0f0; border-radius:10px; overflow:auto;">
    <h2 style="color:white; margin-top:0;">🧬 CAIXA PRETA (LOG)</h2>
    <div id="forensic-content" style="white-space:pre-wrap; margin-bottom:20px;"></div>
    <button onclick="document.getElementById('forensic-panel').style.display='none'"
      style="background:#555; color:white; border:none; padding:10px 20px; border-radius:5px;">FECHAR</button>
    <button onclick="window.Forensic.clear()"
      style="background:red; color:white; border:none; padding:10px 20px; border-radius:5px; margin-left:10px;">LIMPAR
      LOG</button>
  </div>
  <div id="root">
    <div
      style="background:#0A0A0B; color:#10B981; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
      <div
        style="width:40px; height:40px; border:3px solid #10B981; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;">
      </div>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
