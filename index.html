<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bolão App</title>
  <meta name="description" content="Participe dos melhores bolões de futebol!" />
  <meta name="theme-color" content="#0A0A0B" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A0A0B;
      color: #FAFAFA;
      margin: 0;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0A0A0B;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="ios-debug"
    style="position:fixed;top:0;left:0;width:100%;max-height:50%;overflow:auto;background:rgba(255,0,0,0.95);color:white;z-index:999999;font-size:10px;padding:20px;display:none;font-family:monospace;pointer-events:all;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
    <b style="font-size:14px;">🚨 ERRO PÓS-LOGIN (DEBUG)</b><br>
    <div id="ios-msg" style="background:rgba(0,0,0,0.3);padding:10px;border-radius:5px;white-space:pre-wrap;"></div>
  </div>

  <script>
    (function () {
      // 🛡️ BASIC ERROR STABILIZER
      window.onerror = function (msg, url, line, col, error) {
        if (msg.indexOf('ResizeObserver') !== -1) return;
        console.error("Critical Error:", msg, "at", line, url);
      };

      window.onunhandledrejection = function (event) {
        console.error('Unhandled rejection:', event.reason);
      };

      // Ensure Forensic doesn't crash existing code
      window.Forensic = {
        save: function (m) { console.log("🧬 [Log]:", m); },
        show: function () { alert("Logs no console do navegador."); },
        clear: function () { localStorage.clear(); location.reload(); }
      };

      console.log("BOOT: index.html carregado.");
    })();
  </script>

  <div id="root">
    <div
      style="background:#0A0A0B; color:#10B981; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
      <div
        style="width:40px; height:40px; border:3px solid #10B981; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;">
      </div>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
