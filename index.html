  <script>
    // Suppress Dev Warnings
    const origWarn = console.warn;
    const origError = console.error;

    console.warn = (...args) => {
      const msg = args.map(a => String(a)).join(' ');
      if (msg.includes('cdn.tailwindcss.com')) return;
      if ((msg.includes('width') || msg.includes('height')) && (msg.includes('chart') || msg.includes('greater than 0'))) return;
      origWarn(...args);
    };

    console.error = (...args) => {
      const msg = args.map(a => String(a)).join(' ');
      if ((msg.includes('width') || msg.includes('height')) && (msg.includes('chart') || msg.includes('greater than 0'))) return;
      origError(...args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A0A0B;
      color: #FAFAFA;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0A0A0B;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3F3F46;
    }
  </style>
