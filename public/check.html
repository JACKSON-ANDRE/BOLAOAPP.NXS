<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK Bolão App</title>
    <style>
        body {
            background: #000;
            color: #10B981;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .box {
            border: 2px solid #10B981;
            padding: 40px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1 id="status-h1">SISTEMA ONLINE ✅</h1>
        <p>Se você está vendo isso, o servidor está perfeito.</p>
        <p style="color: #FF5555; font-weight: bold;">O Safari do seu iPhone travou em uma versão antiga.</p>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">

        <div id="sw-status" style="font-size: 11px; margin-bottom: 20px; color: #888;">Detectando lixo de memória...
        </div>

        <button id="btn-reset" onclick="hardReset()"
            style="background: #10B981; border: none; padding: 20px 40px; border-radius: 10px; font-weight: 900; color: black; cursor: pointer; text-transform: uppercase; width: 100%; box-shadow: 0 10px 30px rgba(16,185,129,0.3);">
            DESTRAVAR IPHONE AGORA 🚀
        </button>

        <p style="font-size: 10px; margin-top: 20px; opacity: 0.5;">Atenção: Você precisará fazer login novamente.</p>
    </div>

    <script>
        // Kill Service Workers on Load
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                if (registrations.length === 0) {
                    document.getElementById('sw-status').innerText = "Memória Limpa. Pronto para prosseguir.";
                }
                for (let registration of registrations) {
                    registration.unregister();
                    document.getElementById('sw-status').innerText = "Lixo removido! Clique no botão abaixo.";
                }
            });
        }

        function hardReset() {
            // 1. Clear Storage
            localStorage.clear();
            sessionStorage.clear();

            // 2. Kill SW again for safety
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            // 3. Force redirect with Cache Buster
            var buster = Date.now();
            window.location.href = '/?sos=' + buster;
        }
    </script>
</body>

</html>
